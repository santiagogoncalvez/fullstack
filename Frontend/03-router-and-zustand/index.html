<!doctype html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaburoDev — Empleos para desarrolladores</title>
  <meta name="description" content="LaburoDev: buscá tu próximo trabajo como desarrollador. Miles de ofertas con filtros por tecnología, modalidad y nivel." />
  <meta name="theme-color" content="#161209" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e5a83b'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-size='36' font-weight='800' text-anchor='middle' fill='%231a1408'%3EL%3C/text%3E%3C/svg%3E" />
  <script>
    try {
      var t = localStorage.getItem("laburodev-theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
